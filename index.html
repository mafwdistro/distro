<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAFW Distro</title>

<style>
  @font-face {
    font-family: 'AlanisHand';
    src: url('AlanisHand.ttf') format('truetype');
  }

  html, body {
    height: 100%;
  }

  body {
    background-color: #000000;
    color: #ffffff;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }

  .content {
    width: 100%;
    max-width: 700px;
  }

  .horizon img {
    display: block;
    width: 100%;
    height: auto;
  }

  .coming-soon {
    font-family: 'AlanisHand', 'Noto Sans', sans-serif;
    font-size: 1.4em;
    text-align: right;
    margin-top: 10px;
  }
</style>

</head>

<body>

<div class="content">
  <div class="horizon">
    <img src="horizon.png" alt="Desert horizon">
  </div>

  <div class="coming-soon">Coming soon...</div>
  <a rel="me" href="https://ni.hil.ist/@mafwdistro"></a>  
  
</div>

</body>

</html>
