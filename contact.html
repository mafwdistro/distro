<style>

    font-family: 'AlanisHand';
    src: url('AlanisHand.ttf') format('truetype');
  }

  @font-face {
    font-family: 'ModernTypewriter';
    src: url('MODERN_TYPEWRITER.ttf') format('truetype');
  }

  body {
    background-color: #000000;
    color: #ffffff;
    font-family: 'ModernTypewriter', 'Noto Sans', sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 20px;
    line-height: 1.5;
    font-size: 14px;
  }

  h1 {
    font-size: 2.2em;
    margin-top: 0;
    margin-bottom: 30px;
  }

  h2 {
    font-size: 1em;
    margin-top: 0;
    margin-bottom: 20px;
    font-family: 'ModernTypewriter', 'Roboto', 'Noto Sans', sans-serif;
  }

  nav {
    margin-bottom: 30px;
  }

  nav a {
    color: #ffffff;
    text-decoration: none;
    margin-right: 20px;
    font-size: 1.65em;
    font-family: 'AlanisHand', 'Roboto', 'Noto Sans', sans-serif;
  }

  nav a:hover {
    text-decoration: underline;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
    font-size: 1em;
  }

  .contact-row-tight {
    margin-bottom: 6px;
  }

  .contact-icon {
    height: 1.8em;
    width: auto;
  }

  .contact-link {
    color: #ffffff;
  }

  .contact-email {
    font-family: 'ModernTypewriter', 'Noto Sans', sans-serif;
    font-weight: bold;
    color: #ffffff;
    text-decoration: none;
  }

  .contact-email:hover {
    text-decoration: underline;
  }

  .pgp-key {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.75em;
    line-height: 1.4;
    color: #ffffff;
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 20px;
  }

  .copy-pgp-link {
    color: #ffffff;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: 0.8em;
  }

  .copy-pgp-link:hover {
    color: #cccccc;
  }

  .copy-feedback {
    display: inline-block;
    margin-left: 8px;
    font-size: 0.7em;
    color: #888888;
  }

  .horizon {
    display: block;
    margin: px auto 0 auto;
    width: 50%;
  }

  .horizon img {
    display: block;
    width: 100%;
    height: auto;
  }

  @media (max-width: 480px) {
    body {
      padding: 20px 15px;
    }

    nav a {
      display: inline-block;
      margin-right: 14px;
      margin-bottom: 8px;
    }
  }
</style>
</head>
<body>

<a href="index.html"><img src="banner.png" alt="MAFW Distro" style="display:block; max-width:25%; margin-bottom:30px;"></a>
